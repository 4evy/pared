name: Prebuilt macOS release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple silicon download
    # The public-preview image includes macOS 27 and Xcode 27
    runs-on: xcode-27
    if: github.event_name == 'push' && github.ref_type == 'tag'
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Release tag must have the form MAJOR.MINOR.PATCH\n' >&2
            exit 1
          }

      - name: Build CLI and Finder app
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/package-release.sh

      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --notes-file dist/release-notes.md \
            dist/appcast.xml \
            dist/pared-macos-arm64.tar.gz \
            dist/pared-macos-arm64.tar.gz.sha256 \
            dist/pared-app-macos-arm64.zip \
            dist/pared-app-macos-arm64.zip.sha256 \
            dist/install.sh
